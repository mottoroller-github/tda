spring:
  application:
    name: tech-debt-assistant

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tda}
    username: ${DB_USERNAME:tda}
    password: ${DB_PASSWORD:tda_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    de.tda: DEBUG
    org.flywaydb: INFO
